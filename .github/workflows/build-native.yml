name: Build native artifacts

# Unsigned Linux + macOS freezes for people (and maintainers) who do not have
# that OS locally. PyInstaller cannot cross-compile; these jobs run on the OS
# they produce. Tagged, signed releases stay in release.yml.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux AppImage and deb (unsigned)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install native Linux build and audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            appstream build-essential python3-dev linux-libc-dev libportaudio2 portaudio19-dev \
            libgtk-3-0 libgtk-3-dev libwebkit2gtk-4.0-37 libwebkit2gtk-4.0-dev \
            gir1.2-webkit2-4.0 xvfb \
            libgirepository1.0-dev libcairo2-dev pkg-config libx11-6 libxtst6

      - name: Install AppImage build tool
        run: |
          curl --fail --location --retry 3 \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage \
            --output "$RUNNER_TEMP/appimagetool-x86_64.AppImage"
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $RUNNER_TEMP/appimagetool-x86_64.AppImage" \
            | sha256sum --check --strict
          chmod 0755 "$RUNNER_TEMP/appimagetool-x86_64.AppImage"
          curl --fail --location --retry 3 \
            https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64 \
            --output "$RUNNER_TEMP/runtime-x86_64"
          test "$(stat --format=%s "$RUNNER_TEMP/runtime-x86_64")" -eq 944632
          echo "1cc49bcf1e2ccd593c379adb17c9f85a36d619088296504de95b1d06215aebbf  $RUNNER_TEMP/runtime-x86_64" \
            | sha256sum --check --strict

      - name: Build native Linux artifacts
        env:
          APPIMAGETOOL: ${{ runner.temp }}/appimagetool-x86_64.AppImage
          APPIMAGE_RUNTIME_FILE: ${{ runner.temp }}/runtime-x86_64
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: bash scripts/build_linux_appimage.sh

      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf07 # v4.6.0
        with:
          name: linux-unsigned
          path: |
            dist/DCENT_Voice-linux-*.AppImage
            dist/DCENT_Voice-linux-*.AppImage.sha256
            dist/dcent-voice_*.deb
            dist/dcent-voice_*.deb.sha256
          if-no-files-found: error

  macos:
    name: macOS dmg and zip (unsigned)
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Build unsigned macOS artifacts
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: bash scripts/build_macos_app.sh

      - name: Record unsigned status
        run: |
          uv run python scripts/check_macos_pipeline.py
          python -c 'import json,pathlib; p=json.loads(pathlib.Path("dist/macos-pipeline-status.json").read_text()); print(p)'

      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf07 # v4.6.0
        with:
          name: macos-unsigned
          path: |
            dist/DCENT_Voice-macos-*.dmg
            dist/DCENT_Voice-macos-*.zip
            dist/DCENT_Voice-macos-*.sha256
            dist/macos-pipeline-status.json
          if-no-files-found: error
